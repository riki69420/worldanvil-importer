name: Build ElarisImporter.exe

# The .exe has to be built on Windows — PyInstaller freezes the interpreter it
# runs on and cannot cross-compile. This uses GitHub's free windows-latest
# runner so no local Windows machine is needed.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run the test suite
        run: |
          pip install pytest
          python -m pytest -q

      - name: Smoke-test the pipeline
        run: python build.py --out ci-out --no-png

      - name: Build the executable
        run: pyinstaller --noconfirm --clean elaris-importer.spec

      - name: Check the executable starts
        # --selftest imports every module, builds the window off-screen and
        # exits 0. Windows runners have a desktop session, so Tk can open.
        run: |
          $exe = Get-Item dist/ElarisImporter.exe
          "{0}  {1:N1} MB" -f $exe.Name, ($exe.Length / 1MB)
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--selftest" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "self-test exited with $($p.ExitCode)" }
          "self-test passed"
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ElarisImporter-windows
          path: dist/ElarisImporter.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ElarisPasteAssistant-extension
          path: extension/
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ElarisImporter.exe
