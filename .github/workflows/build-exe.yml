name: Build ElarisImporter.exe

# The .exe has to be built on Windows — PyInstaller freezes the interpreter it
# runs on and cannot cross-compile. This uses GitHub's free windows-latest
# runner so no local Windows machine is needed.
#
# Every run produces the bundle zip as an artifact. Pushing a v* tag also
# publishes it as a GitHub Release, which is the download people should use.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v1.0.0). Leave empty for a build only."
        required: false
        default: ""
  push:
    tags:
      - "v*"

env:
  # A tag push, a dispatched release, or a plain build — one version string.
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run the test suite
        run: python -m pytest -q

      - name: Build the executable
        run: pyinstaller --noconfirm --clean elaris-importer.spec

      - name: Check the executable starts
        # --selftest imports every module, builds the window off-screen and
        # exits 0. Windows runners have a desktop session, so Tk can open.
        run: |
          $exe = Get-Item dist/ElarisImporter.exe
          "{0}  {1:N1} MB" -f $exe.Name, ($exe.Length / 1MB)
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--selftest" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "self-test exited with $($p.ExitCode)" }
          "self-test passed"
        shell: pwsh

      - name: Convert the bundled data
        # The runner has Edge, so this also exercises the real map render path
        # the packaged app uses on a user's PC. Output ships in the bundle so
        # the current export is usable without running anything.
        run: python build.py --out bundle/already-converted

      - name: Assemble the bundle
        run: |
          $version = if ("${{ env.VERSION }}") { "${{ env.VERSION }}" } else { "dev-" + "${{ github.sha }}".Substring(0, 7) }
          Copy-Item dist/ElarisImporter.exe bundle/
          Copy-Item INSTRUCTIONS.txt bundle/
          Copy-Item README.md bundle/
          Copy-Item -Recurse extension bundle/extension
          Copy-Item -Recurse data bundle/source-data
          Get-ChildItem bundle/already-converted/map | Format-Table Name, Length
          $zip = "ElarisImporter-$version.zip"
          Compress-Archive -Path bundle/* -DestinationPath $zip
          "BUNDLE=$zip" >> $env:GITHUB_ENV
          "{0}  {1:N1} MB" -f $zip, ((Get-Item $zip).Length / 1MB)
          Get-FileHash $zip -Algorithm SHA256 | Format-List Hash
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ElarisImporter-bundle
          path: ${{ env.BUNDLE }}
          if-no-files-found: error

      - name: Publish release
        if: env.VERSION != ''
        uses: softprops/action-gh-release@v2
        with:
          # On a dispatched release the tag does not exist yet; the action
          # creates it at this commit.
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Elaris Importer ${{ env.VERSION }}
          files: |
            ${{ env.BUNDLE }}
            dist/ElarisImporter.exe
          body: |
            Download **ElarisImporter-${{ env.VERSION }}.zip** — it has everything:

            - `ElarisImporter.exe` — the converter app (Windows, no install)
            - `INSTRUCTIONS.txt` — start here
            - `extension/` — the Chrome/Edge paste assistant for World Anvil
            - `already-converted/` — your current export, already converted (126 articles + map)
            - `source-data/` — the Fantasia Archive export and Azgaar map this was built from

            Windows will warn that the exe is unsigned. More info → Run anyway.
